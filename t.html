<!DOCTYPE html>
<html>
<head>
    <title>Burger Menu</title>
</head>
<body style="
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
    background-image:url('https://images.unsplash.com/photo-1550317138-10000687a72b');
    background-size:cover;
    background-position:center;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
   ">

    <!-- Menu Card Panel -->
    <div style="
        width:350px;
        background:#2f2f2f;
        padding:20px;
        border-radius:8px;
        box-shadow:0px 4px 10px rgba(0,0,0,0.4);
        color:white;
    ">

        <h2 style="
            text-align:center;
            margin:0;
            color:#ffff00;
        ">BURGER</h2>

        <p style="
            text-align:center;
            margin-top:5px;
            margin-bottom:20px;
            color:white;
        ">Menu</p>

        <!-- Burger Items -->
        <div style="width:100%;">

            <div style="display:flex; justify-content:space-between; margin:6px 0;">
                <span>CHICKEN BURGER</span>
                <span>₹ 60</span>
            </div>

            <div style="display:flex; justify-content:space-between; margin:6px 0;">
                <span>DOUBLE CHEESE BURGER</span>
                <span>₹ 70</span>
            </div>

            <div style="display:flex; justify-content:space-between; margin:6px 0;">
                <span>CHICKEN CHEESE BURGER</span>
                <span>₹ 80</span>
            </div>

            <div style="display:flex; justify-content:space-between; margin:6px 0;">
                <span>DOUBLE PATTY BURGER</span>
                <span>₹ 90</span>
            </div>

            <div style="display:flex; justify-content:space-between; margin:6px 0;">
                <span>PEPPER CHICKEN BURGER</span>
                <span>₹ 100</span>
            </div>

        </div>

        <!-- Combos Header -->
        <div style="
            background:yellow;
            padding:5px;
            margin-top:20px;
            text-align:center;
            font-weight:bold;
            color:black;
        ">
            COMBOS
        </div>

        <!-- Combo Items -->
        <div style="width:100%; margin-top:10px;">

            <div style="display:flex; justify-content:space-between; margin:6px 0;">
                <span>CBURGER + FRIES</span>
                <span>₹ 20</span>
            </div>

            <div style="display:flex; justify-content:space-between; margin:6px 0;">
                <span>CHEESE N' TEA</span>
                <span>₹ 30</span>
            </div>

            <div style="display:flex; justify-content:space-between; margin:6px 0;">
                <span>BBQ 'N' CHEESE</span>
                <span>₹ 40</span>
            </div>

            <div style="display:flex; justify-content:space-between; margin:6px 0;">
                <span>BLAST 3</span>
                <span>₹ 50</span>
            </div>

        </div>

    </div>

</body>
</html>
